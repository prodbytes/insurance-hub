# Datasource pointing at the local PostgreSQL started by process-compose.
# ih-audit doesn't own any tables (yet); the configured datasource keeps the
# stack uniform with ih-vdn and stops Dev Services from starting a second
# throwaway postgres container.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=quarkus
quarkus.datasource.password=quarkus
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/insurancehub

# Kafka broker started by process-compose (docker-compose.yaml `kafka`
# service).
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
