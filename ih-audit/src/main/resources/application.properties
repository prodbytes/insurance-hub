quarkus.http.host=0.0.0.0
# 8882: Decision Control owns 8880, ih-vdn 8881, Debezium Connect 8083.
quarkus.http.port=8882

# Running behind a trusted reverse proxy (GitHub Codespaces port forwarding in
# dev, and the production proxy): honor the X-Forwarded-* headers so Quarkus
# builds absolute redirects (e.g. the /app -> /app/ trailing-slash redirect)
# from the public host/scheme instead of localhost:8882, which the proxy can't
# reach.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true

quarkus.rest.path=/rs

# Kafka broker the message reader consumes from (docker-compose.yaml `kafka`
# service). Setting bootstrap servers also stops Quarkus Kafka Dev Services
# from spinning up its own broker.
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Flyway: disabled; ih-audit has no migrations of its own (ih-vdn owns the
# schema), the extension is only part of the shared stack.
quarkus.flyway.migrate-at-start=false

# Tests: Dev Services provide a throwaway PostgreSQL (no datasource URL is set
# for the test profile). No Kafka broker is needed to boot; the reader just
# retries in the background.
%test.quarkus.kafka.devservices.enabled=false
# Random test port so the suite can run while the dev stack occupies 8882.
%test.quarkus.http.test-port=0

# Packaging
quarkus.swagger-ui.always-include=true
